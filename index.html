        function normGrade(g) {

      // 2つ目以降のマーカーの級が空欄でも、遺産全体の級が適用され、全マーカーが表示される。

      if (selectedGrade !== '-') {
        const grades = h.grade ? h.grade.split(',').map(normGrade) : [];
        if (!grades.includes(selectedGrade)) return false;
      }
      return true;

    // MarkerClustererが管理するマーカー集合を独立して保持する。
// AdvancedMarkerElementのmapはクラスタリング中にMarkerClusterer自身がnullへ変更するため、
// mapの値から登録済みマーカーを判定してはいけない。
let clustererMarkers = new Set();
let lastClusterZoom = null;


function syncClusterMarkers(targetMarkers) {
  if (!markerCluster) return false;

  const nextMarkers = new Set(targetMarkers);
  const markersToRemove = [];
  const markersToAdd = [];

  clustererMarkers.forEach(marker => {
    if (!nextMarkers.has(marker)) markersToRemove.push(marker);
  });

  nextMarkers.forEach(marker => {
    if (!clustererMarkers.has(marker)) markersToAdd.push(marker);
  });

  if (markersToRemove.length) {
    markerCluster.removeMarkers(markersToRemove, true);
  }
  if (markersToAdd.length) {
    markerCluster.addMarkers(markersToAdd, true);
  }

  // 追加・削除があった場合だけ、1回まとめてクラスタを再計算する。
  const changed = markersToRemove.length > 0 || markersToAdd.length > 0;
  if (changed) {
    markerCluster.render();
    lastClusterZoom = map ? map.getZoom() : null;
  }

  clustererMarkers = nextMarkers;
  return changed;
}

let lastBounds = null;


function boundsChangedSignificantly(newBounds) {
  if (!lastBounds) return true;

  const ne1 = lastBounds.getNorthEast();
  const sw1 = lastBounds.getSouthWest();
  const ne2 = newBounds.getNorthEast();
  const sw2 = newBounds.getSouthWest();

  const threshold = 0.05;

  return (
    Math.abs(ne1.lat() - ne2.lat()) > threshold ||
    Math.abs(ne1.lng() - ne2.lng()) > threshold ||
    Math.abs(sw1.lat() - sw2.lat()) > threshold ||
    Math.abs(sw1.lng() - sw2.lng()) > threshold
  );
}


function normalizeText(str) {
  if (!str) return '';
  return str
    .toLowerCase()
    .normalize('NFKC')
    .replace(/ヴ/g, 'ゔ')  // ヴはカタカナ範囲外なので個別変換
    .replace(/[ァ-ン]/g, ch =>
      String.fromCharCode(ch.charCodeAt(0) - 0x60)
    );
}

function removeCircleNumber(str) {
  if (!str) return '';
  return str.replace(/\s*(（\d+\/\d+）|（\d+）|[①②③④⑤⑥⑦⑧⑨⑩]+)$/, '');
}

    // 地図を一定時間かけてなめらかに移動する（標準の panTo より遅くしたいとき用）
    const PAN_DURATION_MS = 700;   // ← 大きいほどゆっくり動く
    let panAnimationId = null;

    function slowPanTo(target, duration = PAN_DURATION_MS) {
      if (panAnimationId) cancelAnimationFrame(panAnimationId);
      const t = (typeof target.lat === 'function') ? { lat: target.lat(), lng: target.lng() } : target;
      const c = map.getCenter();
      const sLat = c.lat(), sLng = c.lng();
      const dLat = t.lat - sLat;
      const dLng = ((t.lng - sLng + 540) % 360) - 180;   // 日付変更線をまたぐ場合も近い方向へ
      const t0 = performance.now();
      const ease = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      function step(now) {
        const p = Math.min((now - t0) / duration, 1);
        const e = ease(p);
        map.setCenter({ lat: sLat + dLat * e, lng: sLng + dLng * e });
        panAnimationId = p < 1 ? requestAnimationFrame(step) : null;
      }
      panAnimationId = requestAnimationFrame(step);
    }

    // マーカーを、遺産プルダウン選択時と同じ位置（マーカーが中央より下に来る位置）へ移動する
    function panToMarkerWithOffset(marker) {
      const projection = map.getProjection();
      if (!projection) return;
      const offsetY = window.matchMedia('(max-width: 768px)').matches ? 250 : 150;
      const scale   = Math.pow(2, map.getZoom());
      const world   = projection.fromLatLngToPoint(marker.position);
      const newCenter = projection.fromPointToLatLng(
        new google.maps.Point(world.x, world.y - offsetY / scale)
      );
      slowPanTo(newCenter);
    }

    // ============================================================
    // CSVパーサー
    // ============================================================
    function parseCSVLine(text) {
      const result = [];
      let current = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === ',' && !insideQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    window.initMap = function () {
      // markerclustererライブラリ読み込み後に定義する（外部scriptより前では参照できない）。
      // 標準のidle自動再描画を止め、必要な場合だけクラスタを更新する。
      class StableMarkerClusterer extends markerClusterer.MarkerClusterer {
        onAdd() {
          // Viewport algorithm needs valid map bounds/projection.
          // During the first attachment these may not be ready yet;
          // updateMarkers() performs the first render on the map's idle event.
          const attachedMap = this.getMap();
          const projection = this.getProjection();
          if (attachedMap && attachedMap.getBounds() && projection) {
            this.render();
          }
        }
render() {
          const map = this.getMap();
          if (!(map instanceof google.maps.Map) || !map.getProjection()) return;

          const { clusters, changed } = this.algorithm.calculate({
            markers: this.markers, map, mapCanvasProjection: this.getProjection(),
          });
          if (changed === false) return;

          // 構成マーカーが同じクラスタは、丸アイコンを作り直さず再利用する
          const cache = this._groupCache || (this._groupCache = new Map());
          const ids = this._markerIds || (this._markerIds = new WeakMap());
          this._idSeq = this._idSeq || 0;
          const idOf = m => {
            let i = ids.get(m);
            if (i === undefined) { i = ++this._idSeq; ids.set(m, i); }
            return i;
          };

          const stats = new markerClusterer.ClusterStats(this.markers, clusters);
          const singles = new Set();
          clusters.forEach(c => { if (c.markers.length === 1) singles.add(c.markers[0]); });

          // 前回は単体表示だったが、今回はクラスタに入るマーカーを外す
          (this.clusters || []).forEach(c => {
            if (c.marker && c.markers.length === 1 && !singles.has(c.marker)) c.marker.map = null;
          });

          const usedKeys = new Set();
          clusters.forEach(cluster => {
            if (cluster.markers.length === 1) {
              cluster.marker = cluster.markers[0];
            } else {
              const key = cluster.markers.map(idOf).sort((a, b) => a - b).join(',');
              usedKeys.add(key);
              let gm = cache.get(key);
              if (!gm) {
                gm = this.renderer.render(cluster, stats, map);
                if (this.onClusterClick) {
                  gm.addListener('gmp-click', (event) => {
                    google.maps.event.trigger(this, 'click', cluster);
                    this.onClusterClick(event, cluster, map);
                  });
                }
                cache.set(key, gm);
              }
              cluster.marker = gm;
              cluster.markers.forEach(m => { if (m.map) m.map = null; });
            }
            if (cluster.marker.map !== map) cluster.marker.map = map;
          });

          // 不要になった旧クラスタは次フレームで削除(空白フレームを防ぐ)
          const stale = [];
          cache.forEach((gm, key) => { if (!usedKeys.has(key)) { stale.push(gm); cache.delete(key); } });
          if (stale.length) requestAnimationFrame(() => stale.forEach(gm => { gm.map = null; }));

          this.clusters = clusters;
        }

      }
  map = new google.maps.Map(document.getElementById('map'), {

const searchInput = document.getElementById('search-input');
const clearBtn    = document.getElementById('search-clear');

function getScoredResults(keyword) {
  const resultMap = new Map();
  const clean = value => (value || '').replace(/<br\s*\/?>/gi, '');
  const scoreFor = value => {
    const normalized = normalizeText(clean(value));
    if (!normalized || !normalized.includes(keyword)) return 0;
    return normalized.startsWith(keyword) ? 100 : 10;
  };

  heritageData.forEach(d => {
    // 正式名称候補：searchNameだけを使い、同一遺産IDにつき1件にまとめる。
    const propertyScore = scoreFor(d.searchName);
    if (propertyScore) {
      const key = `${d.country}_${d.id}_property`;
      const existing = resultMap.get(key);
      if (!existing || propertyScore > existing.score ||
          (propertyScore === existing.score && Number(d.num || 0) < Number(existing.data.num || 0))) {
        resultMap.set(key, {
          data: d,
          score: propertyScore,
          displayType: 'property',
          displayName: d.searchName,
          hitFields: { searchName: true }
        });
      }
    }

    // 既存のドロップダウン表記も検索対象として維持（正式名称と同じ場合は重複表示しない）。
    const ddScore = scoreFor(d.ddName);
    if (ddScore && normalizeText(clean(d.ddName)) !== normalizeText(clean(d.searchName))) {
      const key = `${d.country}_${d.id}_ddName`;
      const existing = resultMap.get(key);
      if (!existing || ddScore > existing.score ||
          (ddScore === existing.score && Number(d.num || 0) < Number(existing.data.num || 0))) {
        resultMap.set(key, {
          data: d,
          score: ddScore,
          displayType: 'propertyAlias',
          displayName: d.ddName,
          hitFields: { ddName: true }
        });
      }
    }

    // 個別名候補：suggestNameを表示優先にし、従来の表示形式（<br>込み）を維持する。
    const componentFields = [
      ['suggestName', d.suggestName],
      ['localNameJP', d.localNameJP],
      ['suggestLocalNameJP', d.suggestLocalNameJP],
      ['hira', d.hira],
      ['localLangName', d.localLangName],
      ['localNameEN', d.localNameEN]
    ];
    const hitFields = {};
    let componentScore = 0;
    componentFields.forEach(([field, value]) => {
      const score = scoreFor(value);
      if (score) {
        hitFields[field] = value;
        componentScore = Math.max(componentScore, score);
      }
    });
    if (!componentScore) return;

    let componentDisplayName;
    if (hitFields.suggestName) componentDisplayName = d.suggestName;
    else if (hitFields.suggestLocalNameJP) componentDisplayName = d.suggestLocalNameJP;
    else if (hitFields.localNameJP) componentDisplayName = d.localNameJP;
    else if (hitFields.hira) componentDisplayName = d.suggestHira || d.hira;
    else if (hitFields.localLangName) componentDisplayName = d.localLangName;
    else componentDisplayName = d.localNameEN;

    // suggestNameが正式名称と同じ文字列なら、同一候補の二重表示は避ける。
    if (d.searchName && normalizeText(clean(componentDisplayName)) === normalizeText(clean(d.searchName))) return;

    const componentIdentity = normalizeText(clean(d.localNameJP || d.suggestLocalNameJP || d.suggestName || d.hira || d.localLangName || d.localNameEN || d.num));
    const componentKey = `${d.country}_${d.id}_component_${componentIdentity}`;
    const existing = resultMap.get(componentKey);
    if (!existing || componentScore > existing.score ||
        (componentScore === existing.score && Number(d.num || 0) < Number(existing.data.num || 0))) {
      resultMap.set(componentKey, {
        data: d,
        score: componentScore,
        displayType: 'component',
        displayName: componentDisplayName,
        hitFields
      });
    }
  });

  return Array.from(resultMap.values()).sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    const keyA = normalizeText(clean(a.displayName));
    const keyB = normalizeText(clean(b.displayName));
    if (keyA !== keyB) return keyA.localeCompare(keyB, 'ja');
    return Number(a.data.num || 0) - Number(b.data.num || 0);
  });
}

function highlightText(text, keyword) {
  if (!keyword || !text) return text || '';

  const normalizedKeyword = normalizeText(keyword);
  if (!normalizedKeyword) return text;

  // <br> タグを保護して、文字部分だけを処理する
  return text.split(/(<br\s*\/?>)/gi).map(part => {
    if (/^<br\s*\/?>$/i.test(part)) {
      return '<br>';
    }

    const chars = Array.from(part);

    // 半角・全角変換による文字位置のずれを防ぐ
    for (let start = 0; start < chars.length; start++) {
      for (let end = start + 1; end <= chars.length; end++) {
        const candidate = chars.slice(start, end).join('');

        if (normalizeText(candidate) === normalizedKeyword) {
          const startOffset = chars.slice(0, start).join('').length;
          const endOffset = chars.slice(0, end).join('').length;

          return part.slice(0, startOffset)
            + `<span style="color:#1a73e8;">${part.slice(startOffset, endOffset)}</span>`
            + part.slice(endOffset);
        }
      }
    }

    return part;
  }).join('');
}

    const displayFinal = displayName.replace(/<br\s*\/?>/gi, '<br>') + numLabel;

    return `<div class="suggest-item" onmousedown="handleSuggestClick(${i})" ontouchstart="touchStartY=event.touches[0].clientY" ontouchend="if(Math.abs(event.changedTouches[0].clientY-touchStartY)<10){event.preventDefault();handleSuggestClick(${i})}">
      <div class="suggest-item-name">${highlightText(displayFinal, kw)}</div>
      <div class="suggest-item-sub">${d.country} ／ ${d.type}</div>
    </div>`;
  }).join('');

  suggestBox._results = allResults.map(item => item.data);
  suggestBox.style.display = 'block';
}

searchInput.addEventListener('input', () => {
  clearBtn.style.display = searchInput.value ? 'block' : 'none';
  const keyword = normalizeText(searchInput.value.trim());
  if (!keyword) {
    suggestBox.style.display = 'none';
    if (infoWindow) { infoWindow.close(); infoWindow = null; }
    isSearchMode = false;
    lastOpenedMarker = null;
    const selectedRegion  = getDDRegion();
    const selectedCountry = getDDCountry();
    syncClusterMarkers(markers.filter(m => {
  if (!matchesCategory(m.customData)) return false;
  if (selectedCountry) return m.customData.country === selectedCountry;
  if (selectedRegion) return m.customData.region === selectedRegion;
  return true;
}));
  }
  showSuggests(keyword);
});


searchInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const keyword = normalizeText(searchInput.value.trim());
  if (!keyword) return;
  suggestBox.style.display = 'none';
  const results = getScoredResults(keyword);
  if (results.length === 0) return;
  const d = results[0].data;
  jumpToHeritage(d.country, d.id, d.localNameJP, d.hira, d.heritageName);
});

        });
    }

    function buildHeritageList(country) {
      const list = document.getElementById('heritage-list');
      list.innerHTML = '';
      if (!country || !countryHeritageMap[country]) return;
      const heritages = Object.values(countryHeritageMap[country])
  .filter(h => matchesCategory(h))
  .sort((a, b) => Number(a.id) - Number(b.id));
      heritages.forEach(({ id, heritageName, grade, ddName, type, danger }) => {
        const displayName = ddName
          ? ddName
          : removeCircleNumber(heritageName.replace(/<br\s*\/?>/gi, ''));
        const item = document.createElement('div');
        item.className = 'dd-item';
if (ddState.heritage === `${country}.${id}`) item.classList.add('active');
item.dataset.value = `${country}.${id}`;
const badgeColor = iconColors[type] || 'gray';
item.innerHTML = `<span class="dd-item-badge" style="background:${badgeColor}; border:${danger === "1" ? "2px solid #D32F2F" : "none"}; box-sizing:border-box; display:inline-flex; vertical-align:middle;">${id}</span><span class="dd-item-name">${displayName}</span>`;
item.addEventListener('click', () => onHeritageSelect(`${country}.${id}`));
list.appendChild(item);
      });
    }

    function onHeritageSelect(value) {
      const listEl = document.getElementById('region-list');
      ['region-list','category-list','country-list','heritage-list'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
      if (!value) return;
      const [country, id] = value.split('.');
      if (!country || !id) return;
      const targetMarker = markerIndex.get(`${country}_${id}`);
      if (!targetMarker) return;

      ddState.heritage = value;
      const heritage = countryHeritageMap[country][id];
      const displayName = heritage?.ddName
      ? heritage.ddName.replace(/<br\s*\/?>/gi, ' ')
      : removeCircleNumber((heritage?.heritageName || '').replace(/<br\s*\/?>/gi, ''));
      const badgeColor = iconColors[heritage?.type] || 'gray';
      document.getElementById('heritage-selected').innerHTML = `<span class="dd-item-badge" style="background:${badgeColor}; border:${heritage?.danger === "1" ? "2px solid #D32F2F" : "none"}; box-sizing:border-box; margin-right:4px; display:inline-flex; vertical-align:middle;">${id}</span>${displayName}`;

      if (infoWindow) { infoWindow.close(); infoWindow = null; }
      lastOpenedMarker = null;

      syncClusterMarkers(markers.filter(m => m.customData.country === country && matchesCategory(m.customData)));

      const latLng  = targetMarker.position;
      const offsetY = window.matchMedia('(max-width: 768px)').matches ? 250 : 150;
      const scale   = Math.pow(2, map.getZoom());
      const worldCoordinateCenter = map.getProjection().fromLatLngToPoint(latLng);
      const pixelOffset = new google.maps.Point(0, offsetY / scale);
      const newCenter   = map.getProjection().fromPointToLatLng(
        new google.maps.Point(worldCoordinateCenter.x, worldCoordinateCenter.y - pixelOffset.y)
      );
      map.panTo(newCenter);
      setTimeout(() => { showInfo(targetMarker, true); }, 200);
    }

        // 級ボタン（押すたびに Grade → 4級 → 3級 → 2級 → 準1級 → 1級 → Grade の順に切り替え）
    const gradeSteps = [
      { label: 'Grade', value: '-'   },
      { label: '4級',   value: '4'   },
      { label: '3級',   value: '3'   },
      { label: '2級',   value: '2'   },
      { label: '準1級', value: 'P1' },
      { label: '1級',   value: '1'   }
    ];
    let gradeStepIndex = 0;

    function onGradeToggle() {
      gradeStepIndex = (gradeStepIndex + 1) % gradeSteps.length;
      const step = gradeSteps[gradeStepIndex];
      selectedGrade = step.value;
      const btn = document.getElementById('grade-toggle');
      btn.textContent = step.label;
      btn.setAttribute('aria-label', `級の絞り込み: ${step.label}`);
      if (typeof window.applyFilterChange === 'function') window.applyFilterChange();
    }
    document.getElementById('grade-toggle').addEventListener('click', onGradeToggle);

    function openImageModal(src) {
      const modal    = document.getElementById("image-modal");
      const img      = document.getElementById("modal-img");
      const dropdown = document.getElementById("dropdown-container");
      modal.style.display    = "none";
      dropdown.style.display = "none";
      const tempImg = new Image();
      tempImg.onload  = () => { img.src = src; modal.style.display = "flex"; };
      tempImg.onerror = () => { img.src = src; modal.style.display = "flex"; };
      tempImg.src = src;
    }

    // モーダルを閉じる（initMapの外でDOMに直接登録）
    const _modal = document.getElementById("image-modal");
    if (_modal) {
      _modal.addEventListener("click", () => {
        _modal.style.display = "none";
        document.getElementById("dropdown-container").style.display = "block";
      });
    }

    function jumpToHeritage(country, id, targetLocalNameJP, targetHira, targetHeritageName) {
      const suggestBox = document.getElementById('search-suggest');
      suggestBox.style.display = 'none';
      const groupMarkers = markers.filter(m =>
        m.customData.id == id && m.customData.country == country
      );
      if (groupMarkers.length === 0) return;
      isSearchMode = true;
      syncClusterMarkers(groupMarkers);

      // localNameJP → hira → heritageName の順で完全一致検索
      const mainMarker =
        groupMarkers.find(m => targetLocalNameJP && m.customData.localNameJP === targetLocalNameJP) ||
        groupMarkers.find(m => targetHira && m.customData.hira === targetHira) ||
        groupMarkers.find(m => targetHeritageName && m.customData.heritageName === targetHeritageName) ||
        groupMarkers[0];

      const latLng  = mainMarker.position;
      const offsetY = window.matchMedia('(max-width: 768px)').matches ? 250 : 150;
      const scale   = Math.pow(2, map.getZoom());
      const worldCoordinateCenter = map.getProjection().fromLatLngToPoint(latLng);
      const pixelOffset = new google.maps.Point(0, offsetY / scale);
      const newCenter   = map.getProjection().fromPointToLatLng(
        new google.maps.Point(worldCoordinateCenter.x, worldCoordinateCenter.y - pixelOffset.y)
      );
      map.panTo(newCenter);
      setTimeout(() => { showInfo(mainMarker, true); }, 200);
    }

    function handleSuggestClick(index) {
      const suggestBox = document.getElementById('search-suggest');
      const results = suggestBox._results;
      if (!results || !results[index]) return;
      const d = results[index];
      isSearchMode = true;
      document.getElementById('search-input').blur();
      setTimeout(() => {
        jumpToHeritage(d.country, d.id, d.localNameJP, d.hira, d.heritageName);
      }, 50);
    }

    function clearSearch() {
      const searchInput = document.getElementById('search-input');
      const clearBtn    = document.getElementById('search-clear');
      const suggestBox  = document.getElementById('search-suggest');
      searchInput.value        = '';
      clearBtn.style.display   = 'none';
      suggestBox.style.display = 'none';
      if (infoWindow) { infoWindow.close(); infoWindow = null; }
      isSearchMode     = false;
      lastOpenedMarker = null;
      const selectedRegion  = getDDRegion();
      const selectedCountry = getDDCountry();
            syncClusterMarkers(markers.filter(m => {
        if (!matchesCategory(m.customData)) return false;
        if (selectedCountry) return m.customData.country === selectedCountry;
        if (selectedRegion) return m.customData.region === selectedRegion;
        return true;
      }));
    }

  </script>

  <script src="https://unpkg.com/@googlemaps/markerclusterer@2.6.2/dist/index.min.js">
  </script>

    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCZPRJzf-rbyrdjWjmJYWYpb74dnfLjkHw&libraries=marker&callback=initMap">
